name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build plugin (Emby 4.9.x)
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          dotnet publish Emby.Xtream.Plugin/Emby.Xtream.Plugin.csproj \
            -c Release -o out --no-self-contained -p:Version=$VERSION

      - name: Build plugin (Emby 4.10+)
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          dotnet publish Emby.Xtream.Plugin/Emby.Xtream.Plugin.csproj \
            -c Release_4_10 -o out_4_10 --no-self-contained -p:Version=$VERSION

      - name: Generate release notes
        id: notes
        run: |
          # Find previous tag
          PREV_TAG=$(git tag --sort=-v:refname | grep '^v' | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="${PREV_TAG}..HEAD"
          fi
          # Build notes from commit messages (skip merge commits)
          {
            echo "## What's Changed"
            echo ""
            git log "$RANGE" --no-merges --pretty=format:"- %s" | grep -v "Co-Authored-By"
            echo ""
            echo ""
            echo ""
            echo "## Downloads"
            echo ""
            echo "- **Emby 4.9.x** — \`Emby.Xtream.Plugin.dll\` (default for auto-update)"
            echo "- **Emby 4.10+** — \`Emby.Xtream.Plugin-4.10.dll\` (for 4.10.0.17+ beta only)"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${{ github.ref_name }}"
            fi
          } > release_notes.md

      - name: Create release
        run: |
          # Rename 4.10 DLL so both assets coexist in the release
          cp out_4_10/Emby.Xtream.Plugin.dll out_4_10/Emby.Xtream.Plugin-4.10.dll
          gh release create "$GITHUB_REF_NAME" \
            out/Emby.Xtream.Plugin.dll \
            out_4_10/Emby.Xtream.Plugin-4.10.dll \
            --title "$GITHUB_REF_NAME" \
            --notes-file release_notes.md \
            --prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
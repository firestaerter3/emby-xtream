name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Cheap and independent of the build, so they report before a compile error can hide
      # them. The guard runs its own self-test first: a guard that cannot reject is the same
      # problem as a test that cannot fail.
      - name: Test delete-site guard
        run: python3 scripts/test-check-delete-sites.py

      - name: Check delete sites
        run: python3 scripts/check-delete-sites.py

      - name: Restore tests
        run: dotnet restore Emby.Xtream.Plugin.Tests/

      - name: Test
        run: dotnet test Emby.Xtream.Plugin.Tests/ --no-restore -v minimal --logger "trx;LogFileName=results.trx"

      - name: Build plugin
        run: cd Emby.Xtream.Plugin && bash build.sh

      # One DLL ships for Emby 4.9 and 4.10 (ADR-017). It is compiled against the 4.9 SDK, so
      # these two steps are what catch a 4.10 SDK change it does not satisfy.
      - name: Compile against Emby 4.10 SDK
        run: dotnet build Emby.Xtream.Plugin/Emby.Xtream.Plugin.csproj -c Release_4_10 -v minimal

      - name: Load plugin against Emby 4.9 and 4.10 SDKs
        run: |
          for sdk in emby4_9 emby4_10; do
            dotnet run --project scripts/sdk-load-check -- Emby.Xtream.Plugin/out/Emby.Xtream.Plugin.dll lib/$sdk
          done

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/*.trx'

  mutation:
    name: Mutation (delete paths)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Stryker 5.1 runs on net10.0 but deploys a vstest.console built for net8.0, and the
      # tests are net10.0, so both runtimes are needed. Installing them is cleaner than
      # forcing roll-forward, and keeps the failure mode obvious if either moves.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # Not 4.16: its vstest crashes in test discovery (NullReferenceException in
      # DotnetTestHostManager.GetTestHostPath) when the build uses the .NET 11 SDK, which
      # ubuntu-26.04 images ship from 20261111 on. The job then reports 0 tests and exits 1.
      # No global.json pins the SDK, so a newer SDK on the image can break this again.
      - name: Install Stryker
        run: dotnet tool install -g dotnet-stryker --version 5.1.0

      # Scoped to StrmOwnership and the delete methods of StrmSyncService. These are the
      # only paths that remove a user's files, and a test that cannot fail there is worse
      # than no test: it reads as coverage. Breaks below 75%; see stryker-config.json.
      - name: Mutation test delete paths
        working-directory: Emby.Xtream.Plugin.Tests
        run: $HOME/.dotnet/tools/dotnet-stryker --config-file ../stryker-config.json

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: Emby.Xtream.Plugin.Tests/StrykerOutput/**/reports/*
          if-no-files-found: ignore

  qodana:
    name: Qodana
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Qodana scan
        uses: JetBrains/qodana-action@v2026.1
        with:
          pr-mode: false
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
          QODANA_ENDPOINT: 'https://qodana.cloud'
